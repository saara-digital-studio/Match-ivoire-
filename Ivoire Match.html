<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ivoire Match</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Ivoire Match : plein écran mobile, couleurs du monde en cours, plateau en crème sur décor illustré. */
:root {
  color-scheme: light;
  --wa: #FF8A2A; --wb: #D9480F; --wink: #5A2506;
  --cream: #FFF6E3; --sand: #F3DFB5; --ink: #33210F; --ink2: #6B5840;
  --orange: #FF7A00; --orange-dk: #C95800; --green: #18A058; --green-dk: #0B6E3C; --gold: #FFC531; --gold-dk: #C98200; --red: #D9412F; --red-dk: #9E2A1C;
  --display: "Fredoka", "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --gl: max(14px, env(safe-area-inset-left, 0px)); --gr: max(14px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--wb); color: var(--ink); font: 700 15px var(--body); overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
#app { height: 100%; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, canvas:focus-visible, a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
h1, h2, p { margin: 0; }
h1, h2 { font-family: var(--display); font-weight: 700; text-wrap: balance; }
img.pc { display: block; width: 100%; height: 100%; }
.ico { width: 22px; height: 22px; display: block; }
.flip { display: block; transform: scaleX(-1); }

.screen { position: relative; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.scene-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.bar { position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 10px 6px; padding-left: var(--gl); padding-right: var(--gr); }
.bar h1 { flex: 1; color: #fff; font-size: 23px; text-shadow: 0 2px 0 var(--wink), 0 0 8px rgba(0,0,0,.25); }
.saara { color: #fff; font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .4px; background: rgba(0,0,0,.28); padding: 5px 12px; border-radius: 14px; }
.coins { display: flex; align-items: center; gap: 4px; height: 38px; padding: 0 5px 0 7px; background: linear-gradient(#5A2E10, #331705); color: #fff; font-family: var(--display); font-weight: 600; font-size: 16px; border-radius: 19px; box-shadow: 0 3px 0 #1E0D02; font-variant-numeric: tabular-nums; }
.coins b { font-weight: 600; } .coins img { width: 24px; height: 24px; }
.coins i { font-style: normal; width: 25px; height: 25px; display: grid; place-items: center; background: var(--green); border-radius: 50%; font-size: 18px; line-height: 1; }
.round { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(#7A4A22, #4E2A0F); box-shadow: 0 4px 0 #2B1505; }
.round:active { transform: translateY(3px); box-shadow: 0 1px 0 #2B1505; }
.round.small { width: 36px; height: 36px; } .round.small .ico { width: 18px; height: 18px; }

.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 52px; padding: 7px 18px; border-radius: 21px; font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: .3px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.2); transition: transform .07s; }
.btn::after { content: ""; position: absolute; left: 10px; right: 10px; top: 4px; height: 36%; border-radius: 16px; background: linear-gradient(rgba(255,255,255,.42), rgba(255,255,255,.03)); pointer-events: none; }
.btn:active { transform: translateY(4px); }
.btn img { width: 24px; height: 24px; }
.btn.orange { background: linear-gradient(#FF9D2E, var(--orange)); box-shadow: 0 6px 0 var(--orange-dk), 0 11px 16px rgba(120,50,0,.35); }
.btn.green { background: linear-gradient(#2AC072, var(--green-dk)); box-shadow: 0 6px 0 #064A28, 0 10px 14px rgba(0,60,30,.3); }
.btn.red { background: linear-gradient(#EC5A46, var(--red)); box-shadow: 0 6px 0 var(--red-dk); }
.btn.cream { background: linear-gradient(#FFFBEF, var(--sand)); color: var(--ink); text-shadow: none; box-shadow: 0 6px 0 #C7A873, 0 10px 14px rgba(60,30,0,.25); }
.btn.xl { width: 100%; min-height: 68px; font-size: 28px; border-radius: 27px; }
.btn.small { min-height: 42px; padding: 3px 11px; font-size: 15px; border-radius: 14px; flex: none; }
.btn.small.green { box-shadow: 0 4px 0 #064A28; }
.link { color: var(--ink2); text-decoration: underline; padding: 8px; font-weight: 800; }
.end-main .link { color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); align-self: center; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.small { color: var(--ink2); font-size: 13.5px; line-height: 1.4; }
.star { width: 18px; height: 18px; fill: #D9CDB2; display: block; } .star.on { fill: var(--gold); stroke: #B66A00; stroke-width: 1.2; }
.stars { display: inline-flex; gap: 1px; }

/* Accueil */
.home-main { position: relative; z-index: 2; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; padding-block: 0 max(16px, env(safe-area-inset-bottom, 0px)); padding-left: var(--gl); padding-right: var(--gr); width: 100%; max-width: 480px; margin-inline: auto; overflow-y: auto; }
.logo-wrap { display: flex; flex-direction: column; align-items: center; }
.logo { width: min(82vw, 340px); height: auto; filter: drop-shadow(0 8px 8px rgba(70,30,0,.35)); animation: drop .7s cubic-bezier(.3,1.5,.6,1) both; }
.lg { font-family: var(--display); font-weight: 700; }
.match3 { display: flex; gap: 2px; margin-top: -3px; }
.match3 span { width: 46px; height: 46px; animation: hop 1.5s var(--d) ease-in-out infinite; }
.world-card { background: rgba(255,246,227,.95); border-radius: 26px; padding: 13px 16px; box-shadow: 0 8px 0 rgba(70,35,5,.25), 0 14px 22px rgba(40,20,0,.25); text-align: center; }
.world-card small { color: var(--wb); font-weight: 900; font-size: 13px; }
.world-card h2 { font-size: 25px; color: var(--wink); line-height: 1.05; }
.world-card p { color: var(--ink2); font-size: 14px; }
.wc-pieces { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; margin: 8px auto; max-width: 340px; }
.wc-pieces span { aspect-ratio: 1; animation: hop 2.2s var(--d) ease-in-out infinite; }
.wc-foot { display: flex; align-items: center; justify-content: center; gap: 5px; font-weight: 900; }
.wc-foot span { color: var(--ink2); margin-left: 10px; }
.home-btns { display: flex; flex-direction: column; gap: 14px; }
.daily { display: flex; align-items: center; justify-content: center; gap: 7px; background: rgba(40,20,5,.72); color: #fff; padding: 7px 14px; border-radius: 16px; font-weight: 800; }
.daily img { width: 25px; height: 25px; }

/* Carte */
.world-nav { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; justify-content: center; }
.wn-title { min-width: 0; text-align: center; color: #fff; text-shadow: 0 2px 0 var(--wink), 0 0 6px rgba(0,0,0,.4); }
.wn-title small { display: block; font-size: 12px; font-weight: 800; }
.wn-title b { display: block; font-family: var(--display); font-weight: 600; font-size: 16px; line-height: 1.05; }
@media (max-width: 899px) { .map .coins { display: none; } }
.map-scroll { position: relative; z-index: 2; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.map-stage { position: relative; width: 100%; max-width: 520px; margin-inline: auto; }
.map-path { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-path path { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.p-base { stroke: rgba(50,25,5,.45); stroke-width: 24; }
.p-line { stroke: #FFF3CF; stroke-width: 14; stroke-dasharray: 2 26; }
.lv { position: absolute; --n: 66px; width: var(--n); height: var(--n); transform: translate(-50%, -50%); }
.lv .disc { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 50%; color: #fff; border: 4px solid #fff; font-family: var(--display); font-weight: 700; font-size: 29px; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.n-done .disc { background: radial-gradient(circle at 35% 28%, #4FDC8C, var(--green-dk)); box-shadow: 0 6px 0 #064A28; }
.n-current .disc { background: radial-gradient(circle at 35% 28%, #FFB65C, var(--orange)); box-shadow: 0 6px 0 var(--orange-dk); animation: pulse 1.4s ease-out infinite; }
.n-locked .disc { background: radial-gradient(circle at 35% 28%, #CFC8B9, #8D8676); box-shadow: 0 5px 0 #5E584B; }
.n-locked .ico { width: 28px; height: 28px; }
.lv .stars { position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); padding: 1px 4px; background: rgba(50,25,5,.72); border-radius: 10px; }
.lv .star { width: 15px; height: 15px; } .lv .star:not(.on) { fill: #8D8676; }
.deco { position: absolute; width: 56px; height: 56px; opacity: .92; filter: drop-shadow(0 4px 3px rgba(0,0,0,.3)); }
.chest-goal { position: absolute; left: 50%; transform: translateX(-50%); width: 92px; display: grid; justify-items: center; }
.chest-goal img { width: 54px; height: 54px; animation: hop 1.6s ease-in-out infinite; }
.chest-goal small { background: rgba(50,25,5,.78); color: #FFE27A; padding: 1px 8px; border-radius: 9px; font-weight: 800; white-space: nowrap; }
.world-lock { position: absolute; left: 50%; top: 42%; transform: translateX(-50%); width: min(86%, 320px); background: rgba(40,20,5,.86); color: #fff; padding: 16px; border-radius: 22px; display: grid; justify-items: center; gap: 4px; text-align: center; }
.world-lock .ico { width: 34px; height: 34px; color: var(--gold); } .world-lock b { font-family: var(--display); font-size: 20px; font-weight: 600; }

/* Partie */
.hud { position: relative; z-index: 3; display: flex; align-items: center; gap: 9px; padding-block: 9px 4px; padding-left: var(--gl); padding-right: var(--gr); }
.hud-mid { flex: 1; min-width: 0; color: #fff; text-shadow: 0 1px 0 var(--wink), 0 0 5px rgba(0,0,0,.35); }
.hud-mid small { font-weight: 800; font-size: 13px; }
.score { display: flex; align-items: center; gap: 7px; }
.score b { font-family: var(--display); font-weight: 600; font-size: 19px; font-variant-numeric: tabular-nums; min-width: 60px; }
.sbar { position: relative; flex: 1; height: 13px; border-radius: 7px; background: rgba(40,20,5,.55); overflow: hidden; }
.sbar i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(#FFE27A, var(--orange)); transition: width .25s; }
.sbar u { position: absolute; top: 0; bottom: 0; width: 3px; background: #fff; text-decoration: none; opacity: .85; }
.moves { flex: none; width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; align-content: center; background: linear-gradient(#FFFBEF, var(--sand)); border: 4px solid var(--wa); color: var(--wink); box-shadow: 0 4px 0 rgba(0,0,0,.3); }
.moves b { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: .95; font-variant-numeric: tabular-nums; }
.moves small { font-size: 11px; font-weight: 900; line-height: 1; }
.moves.low { border-color: var(--red); animation: hop .7s ease-in-out infinite; }
.objectives { position: relative; z-index: 3; display: flex; justify-content: center; gap: 7px; padding-block: 3px 6px; padding-left: var(--gl); padding-right: var(--gr); }
.obj { display: flex; align-items: center; gap: 5px; background: rgba(255,246,227,.96); padding: 3px 11px 3px 4px; border-radius: 17px; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.obj img, .obj .star, .o-tile { width: 33px; height: 33px; }
.obj b { font-family: var(--display); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.obj.done { background: #BFF0CF; }
.o-tile { display: block; border-radius: 8px; background-color: #F3A83B; background-image: repeating-linear-gradient(0deg, transparent 0 6px, rgba(255,246,220,.75) 6px 8px), repeating-linear-gradient(90deg, transparent 0 6px, rgba(255,246,220,.75) 6px 8px); }
.board-wrap { position: relative; z-index: 2; flex: 1; min-height: 0; display: grid; place-items: center; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
#board { display: block; touch-action: none; border-radius: 12px; background: rgba(50,25,5,.25); }
.b-tip { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); max-width: 92%; width: max-content; background: rgba(40,20,5,.92); color: #fff; padding: 7px 14px; border-radius: 14px; font-weight: 800; text-align: center; pointer-events: none; }
.boosters { position: relative; z-index: 3; display: flex; justify-content: center; gap: 22px; padding-block: 6px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: var(--gl); padding-right: var(--gr); }
.boost { position: relative; width: 74px; display: grid; justify-items: center; gap: 1px; color: #fff; text-shadow: 0 1px 0 var(--wink), 0 0 5px rgba(0,0,0,.5); }
.boost img { width: 54px; height: 54px; padding: 7px; background: linear-gradient(#FFFBEF, var(--sand)); border-radius: 18px; box-shadow: 0 4px 0 #C7A873; }
.boost span { font-size: 12px; font-weight: 900; }
.boost em { position: absolute; right: 4px; top: -5px; min-width: 23px; height: 23px; padding: 0 4px; display: grid; place-items: center; background: var(--orange); color: #fff; border-radius: 12px; font-style: normal; font-weight: 900; font-size: 13px; }
.boost.on img { outline: 4px solid var(--gold); }

/* Fins de partie */
.end-main { position: relative; z-index: 2; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding-block: 16px; padding-left: var(--gl); padding-right: var(--gr); width: 100%; max-width: 440px; margin-inline: auto; }
.ribbon { align-self: center; padding: 7px 28px; font-family: var(--display); font-weight: 700; font-size: 27px; color: #7A4300; background: linear-gradient(#FFE27A, #FFB31E); border-radius: 18px; box-shadow: 0 6px 0 var(--gold-dk); text-align: center; animation: drop .6s cubic-bezier(.3,1.5,.6,1) both; }
.ribbon.lose { background: linear-gradient(#FFCFA0, #FF9D2E); color: #fff; box-shadow: 0 6px 0 var(--orange-dk); }
.big-stars { display: flex; justify-content: center; align-items: flex-end; gap: 4px; }
.big-stars .star { width: 70px; height: 70px; fill: rgba(255,255,255,.55); } .big-stars span:nth-child(2) .star { width: 92px; height: 92px; }
.big-stars .won .star { fill: var(--gold); stroke: #B66A00; animation: starIn .55s var(--d) cubic-bezier(.3,1.7,.5,1) both; }
.panel { background: rgba(255,246,227,.97); border-radius: 24px; padding: 14px 16px; box-shadow: 0 6px 0 rgba(70,35,5,.25); display: grid; gap: 9px; text-align: center; }
.panel .t { font-family: var(--display); font-weight: 600; font-size: 19px; text-align: left; }
.kv small { display: block; color: var(--ink2); font-weight: 800; }
.kv b { font-family: var(--display); font-weight: 700; font-size: 38px; color: var(--wink); font-variant-numeric: tabular-nums; }
.gains { display: flex; justify-content: center; gap: 14px; font-family: var(--display); font-weight: 600; font-size: 20px; }
.gains span { display: flex; align-items: center; gap: 4px; } .gains img { width: 34px; height: 34px; }
.best { color: var(--green-dk); font-weight: 900; } .found { color: var(--wb); font-weight: 900; font-size: 14px; }
.enc { line-height: 1.4; }
.use-boost small { display: block; color: #fff; font-weight: 900; text-align: center; margin-bottom: 7px; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
#adOffers { display: flex; flex-direction: column; gap: 12px; } #adOffers:empty { display: none; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

/* Collection et paramètres */
.scroll { position: relative; z-index: 2; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-block: 4px 22px; padding-left: var(--gl); padding-right: var(--gr); width: 100%; max-width: 760px; margin-inline: auto; }
.intro { background: rgba(255,246,227,.95); padding: 9px 14px; border-radius: 16px; line-height: 1.35; }
.col-sec { background: rgba(255,246,227,.97); padding: 13px; border-radius: 24px; display: grid; gap: 10px; box-shadow: 0 6px 0 rgba(70,35,5,.25); }
.col-sec h2 { font-size: 19px; color: var(--wink); display: flex; justify-content: space-between; gap: 8px; }
.col-sec h2 small { font-family: var(--body); font-size: 14px; color: var(--ink2); flex: none; }
.col-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.col-item { display: grid; justify-items: center; align-content: start; gap: 1px; padding: 6px 2px; background: #FBEBC8; border-radius: 16px; min-width: 0; }
.col-item img { width: 60px; height: 60px; }
.col-item:not(.on) img { filter: brightness(0) opacity(.42); }
.col-item b { font-family: var(--display); font-weight: 500; font-size: 13.5px; line-height: 1.05; text-align: center; }
.col-item small { color: var(--ink2); font-size: 12px; }
.claimed, .todo { text-align: center; color: var(--ink2); font-size: 13px; } .claimed { color: var(--green-dk); font-weight: 900; }
.set { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 11px; padding: 7px 0; text-align: left; cursor: pointer; }
.set b { display: block; font-weight: 900; } .set small { color: var(--ink2); font-size: 12.5px; }
.set input { position: absolute; right: 0; width: 56px; height: 32px; margin: 0; opacity: 0; cursor: pointer; }
.set i { position: relative; flex: none; width: 56px; height: 32px; border-radius: 16px; background: #C8BFA9; transition: background .2s; }
.set i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 3px rgba(0,0,0,.3); transition: left .2s; }
.set input:checked + i { background: var(--green); } .set input:checked + i::after { left: 27px; }
.set input:focus-visible + i { outline: 3px solid var(--orange); }

/* Modales */
.modal-wrap { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal-bg { position: absolute; inset: 0; background: rgba(30,15,3,.62); }
.modal { position: relative; width: 100%; max-width: 420px; max-height: 88%; overflow-y: auto; background: var(--cream); padding: 18px; border-radius: 28px; display: flex; flex-direction: column; gap: 13px; animation: pop .28s cubic-bezier(.3,1.4,.6,1) both; }
.modal h2 { font-size: 27px; color: var(--wink); } .modal p { line-height: 1.42; }
.intro-top { text-align: center; } .intro-top small { color: var(--wb); font-weight: 900; }
.objlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.objlist li { display: flex; align-items: center; gap: 9px; background: #FBEBC8; padding: 6px 10px; border-radius: 15px; font-weight: 800; }
.objlist img, .objlist .star, .objlist .o-tile { width: 38px; height: 38px; flex: none; }
.moves-line { text-align: center; color: var(--ink2); } .moves-line b { font-family: var(--display); font-weight: 600; font-size: 22px; color: var(--wink); }
.s-row { display: flex; align-items: center; gap: 9px; padding: 6px 0; }
.s-row > img { width: 46px; height: 46px; flex: none; } .s-row > div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.s-row b { font-family: var(--display); font-weight: 600; } .s-row em { font-style: normal; color: var(--green-dk); }
.s-row small { color: var(--ink2); font-size: 12.5px; line-height: 1.2; }
.fiche { width: 124px; height: 124px; align-self: center; flex: none; } .fiche.locked img { filter: brightness(0) opacity(.42); }
.srcs { display: grid; gap: 3px; } .srcs a { color: #0B6E8E; font-size: 13px; font-weight: 800; overflow-wrap: anywhere; }
#toasts { position: fixed; left: 0; right: 0; top: calc(70px + env(safe-area-inset-top, 0px)); z-index: 30; display: grid; justify-items: center; gap: 7px; pointer-events: none; }
.toast { max-width: calc(100% - 32px); background: rgba(40,20,5,.94); color: #fff; padding: 9px 15px; border-radius: 15px; font-weight: 800; animation: toast 2.6s both; text-align: center; }

@keyframes drop { from { transform: translateY(-34px) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes hop { 0%,100% { translate: 0 0; } 50% { translate: 0 -5px; } }
@keyframes pop { from { transform: scale(.84); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pulse { 0% { box-shadow: 0 6px 0 var(--orange-dk), 0 0 0 0 rgba(255,197,49,.9); } 100% { box-shadow: 0 6px 0 var(--orange-dk), 0 0 0 24px rgba(255,197,49,0); } }
@keyframes starIn { from { transform: scale(0) rotate(-100deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toast { 0% { transform: translateY(-12px); opacity: 0; } 8%,88% { transform: none; opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-height: 700px) {
  .wc-pieces { max-width: 240px; } .logo { width: min(66vw, 260px); } .match3 span { width: 34px; height: 34px; }

  function createGame(level, seed) {

      types: level.types, seed: seed | 0, nextId: 0, moves: level.moves, score: 0, status: 'playing',

  function clusterPivot(s, cl, prefer) {

  /* ---------- Effets ---------- */
  const cellsRow = (s, r) => { const a = []; for (let c = 0; c < s.w; c++) if (valid(s, r, c)) a.push(idx(s, r, c)); return a; };
  const cellsCol = (s, c) => { const a = []; for (let r = 0; r < s.h; r++) if (valid(s, r, c)) a.push(idx(s, r, c)); return a; };

  /* Détruit des cases, propage les pièces spéciales et applique objectifs et cases à libérer. */

    step: { type: 'clear', cleared: [], created: [], activated: [], tiles: [], blocks: [], score: 0, chain },

  /* ---------- Mouvements possibles et mélange ---------- */

        s.cells[col].sp = null;
        seeds = [col, ...targets]; ctx.points += 1000;
        mark(col, 'c', targets);
      } else {
        const targets = cellsType(s, po.t);
        s.cells[col].sp = null;
        seeds = [col, ...targets]; ctx.points += 400;
        mark(col, 'c', targets);
      }
    } else if (line(pa) && line(pb)) {

      pa.sp = null; pb.sp = null; seeds = [a, b, ...cells]; ctx.points += 600;

    } else {

/* Progression. Le stockage passe par un adaptateur : une sauvegarde en ligne pourra le remplacer sans toucher au jeu. */
(function (root) {
  'use strict';
  const KEY = 'ivoire-match.save.v1';
  const LocalAdapter = {
    memory: null,
    read() { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : this.memory; } catch { return this.memory; } },
    write(d) { this.memory = d; try { localStorage.setItem(KEY, JSON.stringify(d)); } catch { /* conservé en mémoire */ } },
  };
  const fresh = () => ({
    v: 1, coins: 200, boosters: { hammer: 2, shuffle: 1, rainbow: 1 }, levels: {}, collected: {}, claimed: [], worldRewards: [],
    daily: null, seen: {}, settings: { sound: true, music: true, sfx: true, lite: false },
  });

  S.worldUnlocked = (w) => w === 0 || W()[w - 1].levels.every((l) => S.isDone(l.id));
  S.currentWorld = () => L()[S.currentId()].world;
  S.worldStars = (w) => W()[w].levels.reduce((a, l) => a + S.stars(l.id), 0);
  S.totalStars = () => L().reduce((a, l) => a + S.stars(l.id), 0);

  S.addCollected = (name, n) => {
    const before = S.discovered(name);

/* js/ads.js */
/* Publicités récompensées : uniquement volontaires. Sans fournisseur, aucune offre n'apparaît et aucune récompense publicitaire n'existe.

    },

      return `<div class="screen page">${SC.svg(S.currentWorld())}<header class="bar"><button class="round" data-act="go" data-to="home" aria-label="Accueil">${backIco}</button><h1>Paramètres</h1>${coins()}</header>
        <main class="scroll"><section class="panel">${sw('sound', 'Son', 'Coupe tout le son du jeu')}${sw('music', 'Musique')}${sw('sfx', 'Effets sonores')}${sw('lite', 'Mode économie', 'Moins d’effets, pour les appareils peu puissants')}</section>
        <section class="panel"><b class="t">Progression</b><p class="small">Ta partie est enregistrée sur cet appareil. Effacer les données du navigateur la supprime.</p><button class="btn red" data-act="askReset">Réinitialiser la progression</button></section>
        <section class="panel"><b class="t">À propos</b><p class="small">Ivoire Match est un jeu SAARA. Les musiques et les sons sont générés par le jeu. Les fiches de la Collection citent leurs sources.</p></section></main></div>`;
    },
  };
  const backIco = '<svg viewBox="0 0 24 24" class="ico"><path d="M15.5 3.5L7 12l8.5 8.5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const pauseIco = '<svg viewBox="0 0 24 24" class="ico" fill="currentColor"><rect x="5" y="3" width="5" height="18" rx="1.6"/><rect x="14" y="3" width="5" height="18" rx="1.6"/></svg>';
  const lockIco = '<svg viewBox="0 0 24 24" class="ico" fill="currentColor"><path d="M7 10V7a5 5 0 0110 0v3h1a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2v-8a2 2 0 012-2zm3 0h4V7a2 2 0 00-4 0z"/></svg>';
  const tick = (l, i) => Math.min(96, l.stars[i] / l.stars[1] * 96);
  const objIcon = (o, world) => (o.k === 'collect' ? PC.img(world.pieces[o.t]) : o.k === 'tiles' ? '<span class="o-tile"></span>' : o.k === 'block' ? PC.img('block1') : o.k === 'drop' ? PC.img('tresor') : star(true));

  const objLeft = (o) => { const st = ui.game.state, n = Math.max(0, o.n - E.objectiveValue(st, o)); return o.k === 'score' ? `${num(n)} points` : o.k === 'collect' ? `${n} ${C[WORLDS[ui.game.level.world].pieces[o.t]].name.toLowerCase()}` : o.k === 'tiles' ? `${n} nattes` : o.k === 'block' ? `${n} caisses` : `${n} trésors`; };

  /* ---------- Navigation ---------- */
  function render() {

  /* ---------- Partie ---------- */
  function teardownGame(keep) { if (!keep && ui.rend) { ui.rend.destroy(); ui.rend = null; clearTimeout(ui.hintT); removeGameListeners(); } }
  let removeGameListeners = () => {};
  async function startLevel(l) {
    closeModal();

    await mountBoard();

  function renderGameScreenAgain() {
    ui.screen = 'game'; teardownGame(false);
    app.innerHTML = SCREENS.game();
    return mountBoard();
  }
  async function mountBoard() {
    const g = ui.game, world = WORLDS[g.level.world], names = world.pieces;
    const canvas = document.getElementById('board');
    const wrap = document.getElementById('boardWrap');

      font: FONT, lite: () => S.data.settings.lite,
      onSlow() { if (!S.data.settings.lite) { S.data.settings.lite = true; S.save(); toast('Mode économie activé'); } },
      sound(chain, blast) { blast ? A.blast() : A.pop(chain); }, bad: () => A.bad(), exit: () => A.exit(),
      made(sp) { A.made(); explain(sp); }, chain() {}, progress: updateHud,
    });
    await ui.rend.load([]);
    updateHud(); attachInput(canvas);
    if (g.level.n === 1 && !S.data.seen.tuto) showTip('Échange deux pièces voisines pour en aligner trois.');
    scheduleHint(g.level.n === 1 ? 900 : 7000);
  }
  function fitBoard(wrap, canvas, st) {
    const cs = getComputedStyle(wrap), W = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), Hh = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom), k = Math.min(W / st.w, Hh / st.h);
    canvas.style.width = Math.floor(k * st.w) + 'px'; canvas.style.height = Math.floor(k * st.h) + 'px';
  }
  function explain(sp) {
    if (S.data.seen[sp]) return; S.data.seen[sp] = 1; S.save();
    toast({ h: 'Pièce fléchée : aligne-la pour vider une ligne.', v: 'Pièce fléchée : aligne-la pour vider une colonne.', b: 'Pièce explosive : elle souffle les cases autour d’elle.', c: 'Arc-en-ciel : échange-le avec une pièce pour retirer sa catégorie.' }[sp]);
  }
  function showTip(t) { const n = document.getElementById('tip'); if (n) { n.textContent = t; n.hidden = false; } }
  function hideTip() { const n = document.getElementById('tip'); if (n) n.hidden = true; }
  function updateHud() {
    const g = ui.game; if (!g || !document.getElementById('score')) return;

    document.getElementById('objectives').innerHTML = st.objectives.map((o) => {
      const v = E.objectiveValue(st, o), done = v >= o.n, left = Math.max(0, o.n - v);
      return `<div class="obj ${done ? 'done' : ''}" title="${objText(o, world)}">${objIcon(o, world)}<b>${done ? '✓' : o.k === 'score' ? num(left) : left}</b></div>`;
    }).join('');

  }
  function scheduleHint(ms) {
    clearTimeout(ui.hintT);
    ui.hintT = setTimeout(() => {
      const g = ui.game; if (!g || g.busy || g.state.status !== 'playing' || g.mode || !ui.rend) return;

    }, ms);
  }
  const collectFrom = (steps, names) => {
    const found = [];
    steps.forEach((st) => { if (st.type !== 'clear') return; const c = {}; st.cleared.forEach(({ piece }) => { if (piece.t >= 0) c[names[piece.t]] = (c[names[piece.t]] || 0) + 1; }); st.created.forEach((m) => { if (m.wasT >= 0) c[names[m.wasT]] = (c[names[m.wasT]] || 0) + 1; }); Object.entries(c).forEach(([n, v]) => { if (S.addCollected(n, v)) found.push(n); }); });
    return found;
  };
  async function perform(result) {
    const g = ui.game; g.busy = true;
    ui.rend.setHint(null); clearTimeout(ui.hintT); hideTip();
    try {
      await ui.rend.play(result.steps);
      if (!ui.rend) return;
      ui.rend.sync();
      if (result.ok) { const f = collectFrom(result.steps, WORLDS[g.level.world].pieces); g.found.push(...f); f.forEach((n) => toast(`Découvert : ${C[n].name}`)); S.save(); }
      if (!S.data.seen.tuto && result.ok) { S.data.seen.tuto = 1; S.save(); }
      updateHud();
    } finally { g.busy = false; }
    await afterTurn();
  }
  async function afterTurn() {
    const g = ui.game, st = g.state;
    if (!g || g.ending) return;
    if (st.status === 'won') {
      g.ending = true; g.busy = true;
      await wait(350);
      const fin = E.finale(st);
      if (fin.ok && ui.rend) { await ui.rend.play(fin.steps); ui.rend.sync(); updateHud(); }
      await wait(350);
      const n = E.stars(st, g.level), prev = S.data.levels[g.level.id]?.best || 0, best = st.score > prev && prev > 0;
      const reward = S.completeLevel(g.level, n, st.score);
      ui.result = { level: g.level, stars: n, score: st.score, reward, best, found: g.found };
      ui.screen = 'win'; render();
    } else if (st.status === 'lost') {
      g.busy = true; await wait(450); A.lose(); ui.screen = 'lose'; render();
    } else scheduleHint(7000);
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  function selectCell(i) { const g = ui.game; g.sel = i; ui.rend.setSelected(i); if (i >= 0) A.tap(); }
  function attemptSwap(a, b) {
    const g = ui.game; selectCell(-1);
    const r = E.trySwap(g.state, a, b);
    if (r.reason === 'illegal' || r.reason === 'closed') return;
    perform(r);
  }
  function tapCell(i) {
    const g = ui.game;
    if (g.busy || g.state.status !== 'playing') return;
    if (i < 0) return selectCell(-1);
    if (g.mode) return useTarget(i);
    if (g.sel >= 0) {
      if (g.sel === i) return selectCell(-1);
      const d = Math.abs(E.rowOf(g.state, g.sel) - E.rowOf(g.state, i)) + Math.abs(E.colOf(g.state, g.sel) - E.colOf(g.state, i));
      if (d === 1) return attemptSwap(g.sel, i);
    }
    const p = g.state.cells[i];
    selectCell(p && p.t !== E.BLOCK ? i : -1);
  }
  function setMode(k) {
    const g = ui.game; g.mode = k;
    document.querySelectorAll('.boost').forEach((b) => b.classList.toggle('on', b.id === 'b-' + k));
    ui.rend.setTarget(!!k);
    if (k) { selectCell(-1); showTip(BOOST[k].rule); } else hideTip();
  }
  function useTarget(i) {
    const g = ui.game, k = g.mode;
    const r = k === 'hammer' ? E.useHammer(g.state, i) : E.useRainbow(g.state, i);
    if (!r.ok) { A.bad(); return toast(k === 'hammer' ? 'Le marteau ne peut pas retirer cet élément.' : 'Choisis une pièce simple.'); }
    S.data.boosters[k]--; S.save(); setMode(null); perform(r);
  }
  function attachInput(canvas) {
    let down = null;
    const onDown = (e) => { const g = ui.game; if (g.busy) return; canvas.setPointerCapture?.(e.pointerId); down = { x: e.clientX, y: e.clientY, i: ui.rend.cellAt(e.clientX, e.clientY), moved: false }; scheduleHint(7000); ui.rend.setHint(null); };
    const onMove = (e) => {
      if (!down || down.moved || ui.game.mode) return;
      const dx = e.clientX - down.x, dy = e.clientY - down.y, th = ui.rend.view.cell * .35;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < th || down.i < 0) return;
      down.moved = true;
      const st = ui.game.state, r = E.rowOf(st, down.i) + (Math.abs(dy) > Math.abs(dx) ? Math.sign(dy) : 0), c = E.colOf(st, down.i) + (Math.abs(dx) >= Math.abs(dy) ? Math.sign(dx) : 0);
      if (E.valid(st, r, c) && st.status === 'playing' && !ui.game.busy) attemptSwap(down.i, E.idx(st, r, c));
    };
    const onUp = () => { if (down && !down.moved) tapCell(down.i); down = null; };
    const onKey = (e) => {
      const g = ui.game, st = g.state; const dir = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
      if (dir) { e.preventDefault(); if (g.cursor < 0) g.cursor = E.idx(st, 3, 3); else { const r = E.rowOf(st, g.cursor) + dir[0], c = E.colOf(st, g.cursor) + dir[1]; if (E.valid(st, r, c)) g.cursor = E.idx(st, r, c); } ui.rend.setCursor(g.cursor); }
      if ((e.key === 'Enter' || e.key === ' ') && g.cursor >= 0) { e.preventDefault(); tapCell(g.cursor); }
    };
    const onResize = () => { fitBoard(document.getElementById('boardWrap'), canvas, ui.game.state); ui.rend.layout(); };
    canvas.addEventListener('pointerdown', onDown); canvas.addEventListener('pointermove', onMove); canvas.addEventListener('pointerup', onUp); canvas.addEventListener('pointercancel', () => { down = null; }); canvas.addEventListener('keydown', onKey);
    window.addEventListener('resize', onResize);
    removeGameListeners = () => window.removeEventListener('resize', onResize);
  }

  function afterWin() {
    const r = ui.result, reduced = S.data.settings.lite || matchMedia('(prefers-reduced-motion: reduce)').matches;
    A.win(); [...Array(r.stars)].forEach((_, i) => setTimeout(() => A.star(), 300 + i * 300));
    const el = document.getElementById('endScore'), t0 = performance.now();
    const f = (t) => { if (!el.isConnected) return; const k = reduced ? 1 : Math.min(1, (t - t0) / 900); el.textContent = num(Math.round(r.score * k)); if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
    if (!reduced) confetti();
  }
  function confetti() {
    const c = document.getElementById('confetti'); if (!c) return;
    const W = innerWidth, H = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2); c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext('2d'); g.scale(dpr, dpr);
    const col = ['#FF7A00', '#FFF6E3', '#18A058', '#FFC531', '#FF4D4D'];
    const P = [...Array(150)].map(() => ({ x: Math.random() * W, y: -20 - Math.random() * H, w: 6 + Math.random() * 8, h: 8 + Math.random() * 8, c: col[Math.floor(Math.random() * 5)], v: 2.4 + Math.random() * 3.6, r: Math.random() * 6, s: (Math.random() - .5) * .25 }));
    const t0 = performance.now();
    const frame = (t) => { if (!c.isConnected) return; g.clearRect(0, 0, W, H); P.forEach((p) => { p.y += p.v; p.r += p.s; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore(); }); if (t - t0 < 4500) requestAnimationFrame(frame); else g.clearRect(0, 0, W, H); };
    requestAnimationFrame(frame);
  }
  async function offerAds() {
    const box = document.getElementById('adOffers'); if (!box) return;
    const list = ['second_chance', 'extra_moves'];
    for (const p of list) if (await Ads.canOffer(p)) box.insertAdjacentHTML('beforeend', `<button class="btn green" data-act="ad" data-p="${p}">Regarder une publicité : ${Ads.PLACEMENTS[p].label}</button>`);
  }
  async function resumeWith(fn) { const g = ui.game; fn(g.state); g.ending = false; g.busy = false; await renderGameScreenAgain(); }

  const ACT = {
    go: (d) => go(d.to),
    world: (d) => { ui.world = Math.max(0, Math.min(WORLDS.length - 1, ui.world + +d.d)); ui.worldSet = true; ui.screen = 'map'; render(); ui.worldSet = false; },
    intro: (d) => { const l = LEVELS[+d.id]; if (S.levelState(l.id) === 'locked' || !S.worldUnlocked(l.world)) { A.bad(); return toast('Termine d’abord les niveaux précédents.'); } introModal(l); },
    start: (d) => startLevel(LEVELS[+d.id]),
    shop: shopModal,
    buy: (d) => { if (!S.buy(d.id)) { A.bad(); return toast(`Il te faut ${S.PRICES[d.id]} cauris.`); } A.coin(); refreshCoins(); shopModal(); if (ui.screen === 'game') updateHud(); },
    closeModal,
    daily: async () => { const n = S.claimDaily(); if (n) { A.coin(); toast(`+${n} cauris`); render(); } if (n && await Ads.canOffer('daily_reward')) modal(`<h2>Doubler ton cadeau ?</h2><p>Regarde une publicité pour recevoir ${n} cauris de plus.</p><button class="btn green" data-act="ad" data-p="daily_reward">Regarder la publicité</button><button class="link" data-act="closeModal">Non merci</button>`); },
    boost: (d) => {
      const g = ui.game; if (g.busy || g.state.status !== 'playing') return;
      if (g.mode === d.id) return setMode(null);
      if (S.data.boosters[d.id] < 1) { A.bad(); toast('Plus de booster : passe par la boutique.'); return shopModal(); }
      if (BOOST[d.id].needs) return setMode(d.id);
      if (g.state.moves <= 0) return toast('Le mélangeur n’aide pas sans déplacement.');
      setMode(null); const r = E.useShuffle(g.state); S.data.boosters[d.id]--; S.save(); perform(r);
    },
    pause: () => { modal(`<h2>Pause</h2><div class="stack"><button class="btn orange" data-act="closeModal">REPRENDRE</button><button class="btn cream" data-act="restart">Recommencer</button><button class="btn cream" data-act="quit">Quitter le niveau</button></div>`); },
    quit: () => { closeModal(); go('map'); },
    restart: () => { closeModal(); startLevel(ui.game.level); },
    replay: () => startLevel(ui.result.level),
    nextLevel: () => { const n = LEVELS[ui.result.level.id + 1]; if (n) { ui.world = n.world; ui.worldSet = true; ui.screen = 'map'; render(); ui.worldSet = false; introModal(n); } else go('map'); },
    buyMoves: () => { const g = ui.game, cost = g.continues ? 300 : 150; if (!S.spend(cost)) { A.bad(); return toast(`Il te faut ${cost} cauris.`); } g.continues++; resumeWith((st) => E.addMoves(st, 5)); },
    resumeBoost: (d) => { resumeWith((st) => E.resumeForBooster(st)).then(() => setMode(d.id)); },
    ad: async (d) => {
      const res = await Ads.request(d.p); closeModal();
      if (!res.granted) return toast('Aucune récompense : la publicité n’a pas été terminée.');
      const r = res.reward;
      if (r.moves && ui.game) return resumeWith((st) => E.addMoves(st, r.moves));
      if (r.doubleDaily) { S.data.coins += 60; S.save(); refreshCoins(); toast('+60 cauris'); }
      if (r.boosters) { Object.entries(r.boosters).forEach(([k, n]) => { S.data.boosters[k] += n; }); S.save(); toast('Booster ajouté'); }
    },
    fiche: (d) => {
      const c = C[d.id];
      if (!S.discovered(d.id)) return modal(`<div class="fiche locked">${PC.img(d.id)}</div><h2>Objet à découvrir</h2><p>Aligne cet objet encore ${S.DISCOVER_AT - Math.min(S.DISCOVER_AT, S.data.collected[d.id] || 0)} fois pour révéler sa fiche.</p><button class="btn cream" data-act="closeModal">FERMER</button>`);
      modal(`<div class="fiche">${PC.img(d.id)}</div><h2>${c.name}</h2><p>${c.info}</p><div class="srcs">${c.src.map((s) => `<a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`).join('')}</div><button class="btn cream" data-act="closeModal">FERMER</button>`);
    },
    claimCol: (d) => { if (S.claimCollection(+d.w)) { A.coin(); toast('Récompense reçue'); render(); } },
    askReset: () => modal(`<h2>Tout effacer ?</h2><p>Niveaux, étoiles, cauris, boosters et Collection seront perdus.</p><div class="stack"><button class="btn red" data-act="reset">OUI, EFFACER</button><button class="btn cream" data-act="closeModal">Annuler</button></div>`),
    reset: () => { S.reset(); closeModal(); ui.screen = 'home'; render(); toast('Progression réinitialisée'); },
  };
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    A.tap(); A.sync();
    const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset, el);
  });
  document.addEventListener('change', (e) => { const k = e.target.dataset?.k; if (!k) return; S.data.settings[k] = e.target.checked; S.save(); A.sync(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  render();
  root.IM_DEBUG = { ui, ACT, go, render, startLevel, tapCell, attemptSwap, perform };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
